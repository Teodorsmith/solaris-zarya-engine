[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solaris-zarya-engine"
version = "0.1.0"
description = "Autonomous AI Double with 4-Tier Persistent SQLite Memory, AST-Sandboxed Skill Synthesis, Crash-Resumable Task FSM, and Deterministic Permission Governance."
authors = [
    { name = "Teodor Smith" }
]
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.8.0",
    "requests>=2.31.0",
    "sqlite-vec>=0.1.0",
    "httpx>=0.27.0",
    "pymupdf>=1.23.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "peft>=0.9.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.27.0",
    "datasets>=2.16.0",
]
test = [
    "pytest>=7.0.0",
    "fastembed>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
exclude = ["data*", "skills*", "seed_data*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

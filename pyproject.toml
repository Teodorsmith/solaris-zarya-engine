[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solaris-zarya-engine"
version = "0.1.0"
description = "Autonomous epistemic engine with QLoRA DPO self-evolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec>=0.1.0",
    "fastembed>=0.2.0",
    "trafilatura>=1.6.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.5.0",
    "groq>=0.5.0",
    "openai>=1.12.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pymupdf>=1.23.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "fastembed>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
exclude = ["data*", "skills*", "seed_data*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
